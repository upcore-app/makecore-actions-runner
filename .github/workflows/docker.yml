name: Docker

on:
  push:
    branches: [main]
  release:
    types: [published]

  # Rebuilt on a timer as well as on a change.
  #
  # Nothing in the Dockerfile changes when Ubuntu ships a security update, when
  # a new Actions runner is released, or when the kernel is patched. A node
  # pulls this image only when its tag moves, so with no rebuild it keeps
  # booting the packages of the day this file last changed.
  schedule:
    - cron: '0 4 * * 1'

  workflow_dispatch:
    inputs:
      no_cache:
        description: Ignore the layer cache, to pick up every upstream update
        type: boolean
        default: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: makecore-max
    # The image carries a kernel, two runners, a Docker daemon and the
    # toolchains, and it is built for two architectures.
    timeout-minutes: 180
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v5

      # The hosted runner has about 14 GB free, and this image does not fit
      # beside what the image of the runner itself ships.
      - name: Make room on the builder
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo rm -rf /usr/local/share/boost "$AGENT_TOOLSDIRECTORY"
          df -h /

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}
            # A scheduled build is what picks up upstream updates, so it gets a
            # tag that says which day's packages a node is running.
            type=schedule,pattern={{date 'YYYYMMDD'}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64 #,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # No registry or GHA cache. Exporting the layers of an image this
          # size costs more than rebuilding them, and the node already keeps
          # BuildKit's own cache on the disk it commits after a job.
          #
          # A scheduled rebuild exists to take upstream updates. Reading that
          # local cache would return the same layers and publish the same
          # packages under a new tag.
          no-cache: ${{ github.event_name == 'schedule' || inputs.no_cache == true }}
